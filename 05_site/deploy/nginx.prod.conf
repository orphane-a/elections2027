# Nginx de la PROD (demandez-le-programme.fr) : site public, indexable.

# Mesure d'audience côté serveur (ticket 95), voir DEPLOIEMENT.md.
# Un journal par jour (temps universel), une ligne JSON par requête, réduite au minimum :
# date, adresse, méthode, page sans paramètres, code de réponse, navigateur, domaine du référent
# (jamais l'adresse complète), signaux « ne pas suivre » (DNT, Sec-GPC).
# Les journaux sont supprimés après 7 jours par stats/agreger.mjs (cron de la nuit).
map $time_iso8601 $visites_jour {
    "~^(?<j>\d{4}-\d{2}-\d{2})" $j;
    default                     inconnu;
}
map $http_referer $visites_ref {
    "~^[a-zA-Z][a-zA-Z0-9+.-]*://(?<d>[^/:?#]+)" $d;
    default                                       "";
}
log_format visites escape=json '{"date":"$time_iso8601","ip":"$remote_addr","methode":"$request_method",'
    '"page":"$uri","statut":$status,"ua":"$http_user_agent","ref":"$visites_ref",'
    '"dnt":"$http_dnt","gpc":"$http_sec_gpc"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Vraie adresse du visiteur : Nginx ne reçoit que des requêtes de Traefik, sur le réseau Docker
    # « coolify » (adresses privées). On ne lit X-Forwarded-For que si la requête vient de ces réseaux.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Seul journal d'accès (remplace la sortie standard : les adresses ne restent pas dans les journaux Docker).
    access_log /var/log/nginx/visites/acces-$visites_jour.log visites;
    open_log_file_cache max=4 inactive=1m valid=1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
